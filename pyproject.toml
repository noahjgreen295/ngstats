# ################## NGSTATS ##################

# ############ Main ############
[project]
name = "ngstats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noah Green", email = "noahjgreen295@gmail.com" }
]


# ############ Dependencies ############
# #### Production ####
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

# #### Dev and others ####
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# ############ Dev tools ############
[tool.ruff]
line-length = 88
target-version = "py310"   # match the floor of your requires-python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]


# ############ Packaging ############
[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"



